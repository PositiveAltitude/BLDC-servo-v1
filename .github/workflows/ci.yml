name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint firmware
        run: cargo clippy --package bldc-servo --locked -- -D warnings

      - name: Lint protocol crate
        run: cargo clippy --package bldc-servo-protocol --all-targets --target x86_64-unknown-linux-gnu --locked -- -D warnings

      - name: Lint controller library
        run: cargo clippy --package bldc-servo --lib --target x86_64-unknown-linux-gnu --locked -- -D warnings

      - name: Test protocol crate
        run: cargo test --package bldc-servo-protocol --target x86_64-unknown-linux-gnu --locked

      - name: Test controller library
        run: cargo test --package bldc-servo --lib --target x86_64-unknown-linux-gnu --locked

      - name: Check firmware compilation
        run: cargo check --package bldc-servo --locked

      - name: Build release firmware
        run: cargo build --package bldc-servo --release --locked
